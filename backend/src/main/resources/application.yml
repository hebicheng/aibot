server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: native

spring:
  application:
    name: purchase-ai-bot
  # 未显式指定 profile 时按 local 启动。
  # 本地私密配置（数据库密码 / 三方密钥）放 backend/config/application-local.yml，
  # 该文件已被 .gitignore 忽略；仓库里只有 application-local.yml.example 模板。
  # 生产用环境变量覆盖，或 -Dspring.profiles.active=prod。
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/purchase_ai_bot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

security:
  # 本地开发用的固定占位密钥；生产必须用 TOKEN_SECRET 覆盖
  token-secret: ${TOKEN_SECRET:local-dev-only-insecure-token-secret}
  token-ttl-seconds: ${TOKEN_TTL_SECONDS:604800}

wechat:
  # AppID / AppSecret 由本地配置文件或环境变量提供，仓库里不落真实值
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
  mock-login: ${WECHAT_MOCK_LOGIN:false}
  qr-page: ${WECHAT_QR_PAGE:pages/login/confirm}
  # 小程序码扫码登录：确认页路径与版本（develop / trial / release）
  qr-env-version: ${WECHAT_QR_ENV:trial}

ai:
  mock: ${AI_MOCK:false}
  qwen:
    # 不配置 key 时 QwenClient.isConfigured()=false，聊天自动走结构化兜底，不会导致启动失败
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    model: ${QWEN_MODEL:qwen3.8-max}
    timeout-seconds: ${QWEN_TIMEOUT:120}

# 计费 / 积分：换算公式 costCredits = total_tokens / 1000 × yuanPerThousandTokens × priceMultiplier × creditsPerYuan
# 默认（按当前千问最贵档 qwen3.7-max 输出单价 0.0432 元/千token 兜底，100 倍商业价，积分与元 1:1）：
#   1000 token → 0.0432 × 100 × 1 = 0.432 积分（1 token ≈ 0.000432 积分，单次聊天约 6.5~14.5 积分）
#   调价改这里即可，客户无感知。
billing:
  yuan-per-thousand-tokens: ${BILLING_YUAN_PER_1K:0.0432}
  price-multiplier: ${BILLING_PRICE_MULTIPLIER:10}
  credits-per-yuan: ${BILLING_CREDITS_PER_YUAN:1}
  monthly-quota: ${BILLING_MONTHLY_QUOTA:1500}

storage:
  # 默认落本地磁盘（./uploads），本地开发无需配置对象存储；
  # 需要上传到 COS 时在 application-local.yml 里设 type: cos 并填密钥
  type: ${STORAGE_TYPE:local}
  local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8090/files}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:}

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 行情爬虫开关（已拆分为启动/定时两个独立开关）：
  #  - crawler-enabled-on-startup：应用启动后是否全量拉取一次
  #  - crawler-enabled-scheduled：是否按定时任务周期拉取
  # 可用环境变量 APP_CRAWLER_ENABLED_ON_STARTUP / APP_CRAWLER_ENABLED_SCHEDULED 覆盖
  crawler-enabled-on-startup: ${APP_CRAWLER_ENABLED_ON_STARTUP:false}
  crawler-enabled-scheduled: ${APP_CRAWLER_ENABLED_SCHEDULED:true}
  # gtgqw 爬取城市列表（逗号分隔），默认杭州
  crawl-cities: ${APP_CRAWL_CITIES:杭州}
  # 本批次行情城市（2026-11-12）：城市是行情的一个维度，取价只在本城市内按产地优先，
  # 绝不跨城市平均。当前只用杭州一个市场，将来接项目/批次城市时改这里即可。
  market-city: ${APP_MARKET_CITY:杭州}

management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
